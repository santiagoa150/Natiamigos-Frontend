<div class="relative">
  <input
    [id]="id"
    [type]="showPassword() ? 'text' : 'password'"
    [autocomplete]="autocomplete"
    [placeholder]="placeholder"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
    class="w-full rounded-lg border px-4 py-2.5 pr-11 text-secondary-900 placeholder:text-secondary-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none"
    [class.border-secondary-300]="!invalid"
    [class.border-red-400]="invalid"
  />
  <button
    type="button"
    (click)="togglePasswordVisibility()"
    class="absolute inset-y-0 right-0 flex w-11 cursor-pointer items-center justify-center text-secondary-500 hover:text-secondary-700"
    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  >
    <span class="material-icons text-xl">{{
      showPassword() ? 'visibility_off' : 'visibility'
    }}</span>
  </button>
</div>

<section class="flex min-h-screen flex-col md:flex-row">
  <div
    class="bg-natillera-pattern flex w-full items-center justify-center bg-primary-600 px-6 py-4 sm:px-10 sm:py-6 md:h-auto md:w-1/2 md:px-12 md:py-0"
  >
    <img src="/logo.svg" alt="Natiamigos" class="w-64 sm:w-80 md:w-full md:max-w-xl xl:max-w-2xl" />
  </div>

  <div
    class="flex w-full flex-1 items-center justify-center bg-secondary-50 px-6 py-12 sm:px-12 md:w-1/2"
  >
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl sm:p-10">
      <h1 class="text-3xl font-bold text-secondary-900" i18n="@@home.login.title">Ingresar</h1>
      <p class="text-sm text-secondary-600" i18n="@@home.login.subtitle">
        Ingresa para seguir ahorrando en tu natillera.
      </p>

      <div class="mt-3 mb-6 h-1 w-full rounded-full bg-primary-500"></div>

      <form class="flex flex-col gap-3" [formGroup]="form">
        <div class="flex flex-col gap-1.5">
          <label
            for="email"
            class="text-sm font-bold text-secondary-700"
            i18n="@@home.login.email.label"
          >
            Correo
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="off"
            placeholder="tucorreo@ejemplo.com"
            i18n-placeholder="@@home.login.email.placeholder"
            class="rounded-lg border px-4 py-2.5 text-secondary-900 placeholder:text-secondary-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none"
            [class.border-secondary-300]="
              form.controls.email.valid || form.controls.email.untouched
            "
            [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
          />
          <p
            class="text-xs text-red-500"
            [class.invisible]="form.controls.email.valid || form.controls.email.untouched"
          >
            @if (form.controls.email.errors?.['required']) {
              <span i18n="@@home.login.email.error.required">Ingresa tu correo</span>
            } @else {
              <span i18n="@@home.login.email.error.invalid">Ingresa un correo válido</span>
            }
          </p>
        </div>

        <div class="flex flex-col gap-1.5">
          <label
            for="password"
            class="text-sm font-bold text-secondary-700"
            i18n="@@home.login.password.label"
          >
            Contraseña
          </label>
          <app-password-input
            [id]="'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            i18n-placeholder="@@home.login.password.placeholder"
          />
          <p
            class="text-xs text-red-500"
            [class.invisible]="form.controls.password.valid || form.controls.password.untouched"
            i18n="@@home.login.password.error"
          >
            Ingresa tu contraseña
          </p>
        </div>

        <button
          type="button"
          [disabled]="form.invalid"
          class="mt-2 cursor-pointer rounded-lg bg-primary-600 px-5 py-2.5 font-semibold text-white transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:bg-secondary-200 disabled:text-secondary-400 disabled:hover:bg-secondary-200"
          i18n="@@home.login.submit"
        >
          Ingresar
        </button>
      </form>
    </div>
  </div>
</section>

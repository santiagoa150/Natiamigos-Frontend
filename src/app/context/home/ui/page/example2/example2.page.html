<section class="mx-auto max-w-3xl px-6 py-12">
  <h1 class="text-4xl font-bold text-secondary-900" i18n="@@example2.title">Página de ejemplo 2</h1>
  <p class="mt-2 text-secondary-600" i18n="@@example2.description">
    Otra vista de ejemplo usando el mismo theme de Tailwind.
  </p>

  <div class="mt-8 grid gap-4 sm:grid-cols-3">
    <div class="rounded-xl border border-secondary-200 bg-primary-50 p-6">
      <h2 class="font-semibold text-primary-700" i18n="@@example2.primary.title">Primary</h2>
      <p class="mt-1 text-sm text-secondary-600" i18n="@@example2.primary.description">
        Color principal del theme.
      </p>
    </div>

    <div class="rounded-xl border border-secondary-200 bg-secondary-100 p-6">
      <h2 class="font-semibold text-secondary-700" i18n="@@example2.secondary.title">Secondary</h2>
      <p class="mt-1 text-sm text-secondary-600" i18n="@@example2.secondary.description">
        Color de apoyo del theme.
      </p>
    </div>

    <div class="rounded-xl border border-secondary-200 bg-accent-50 p-6">
      <h2 class="font-semibold text-accent-700" i18n="@@example2.accent.title">Accent</h2>
      <p class="mt-1 text-sm text-secondary-600" i18n="@@example2.accent.description">
        Color de énfasis del theme.
      </p>
    </div>
  </div>

  <button
    type="button"
    class="mt-8 rounded-lg bg-accent-500 px-5 py-2 font-semibold text-white transition hover:bg-accent-600"
    i18n="@@example2.action"
  >
    Acción de énfasis
  </button>
</section>

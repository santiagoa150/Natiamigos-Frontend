<section
  class="mx-auto flex min-h-[60vh] max-w-3xl flex-col items-center justify-center gap-6 px-6 text-center"
>
  <span
    class="rounded-full bg-primary-100 px-4 py-1 text-sm font-medium text-primary-700"
    i18n="@@example1.badge"
  >
    Ejemplo 1
  </span>

  <h1 class="text-4xl font-bold text-secondary-900" i18n="@@example1.title">Página de ejemplo 1</h1>

  <p class="max-w-xl text-secondary-600" i18n="@@example1.description">
    Esta página demuestra el theme de Tailwind del proyecto usando los colores
    <span class="font-semibold text-primary-600">primary</span>,
    <span class="font-semibold text-secondary-600">secondary</span>
    y <span class="font-semibold text-accent-600">accent</span>.
  </p>

  <button
    type="button"
    class="rounded-lg bg-primary-600 px-5 py-2 font-semibold text-white transition hover:bg-primary-700"
    i18n="@@example1.action"
  >
    Acción primaria
  </button>
</section>
